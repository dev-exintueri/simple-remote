# Spike only (throwaway): egui probe build (Task 12)
# Plan: docs/superpowers/plans/2026-09-23-sp1-phase0-spikes.md
# Runs only when its own spike folders change (decision D24). Edits to this workflow file alone
# do not trigger it; use workflow_dispatch or touch a file in the listed folders.
name: windows-egui

on:
  push:
    paths:
      - 'spikes/egui-probe/**'
      - 'spikes/rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        working-directory: spikes
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: build egui-probe
        working-directory: spikes/egui-probe
        run: cargo build --release

      - name: upload exes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: win-egui
          path: |
            spikes/egui-probe/target/release/egui_probe.exe
          if-no-files-found: warn
          retention-days: 14
